name: "Test"
on:
  pull_request:
  push:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - run: nix build
    - run: nix flake check
  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cachix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: nix build .#static
      - name: Test without Nix
        run: |
          mkdir -p release
          cp result/bin/fixepub release/fixepub
          docker run --rm --network none -v "$PWD/release:/work:ro" alpine:3.22 /work/fixepub --help
          docker run --rm --network none -v "$PWD/release:/work:ro" debian:bookworm-slim /work/fixepub --help
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: result/bin/fixepub
